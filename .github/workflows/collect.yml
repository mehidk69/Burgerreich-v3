name: Collect OSINT Feeds

on:
  schedule:
    # Every 6 hours
    - cron: "0 0,6,12,18 * * *"
    # Friday night sweep
    - cron: "0 22 * * 5"
    # Monday afternoon sweep
    - cron: "30 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Install dependencies
        run: pip install -r collectors/requirements.txt

      - name: Run all collectors
        run: python run_all.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git diff --cached --quiet || git commit -m "OSINT collect ${TIMESTAMP}"
          git push
