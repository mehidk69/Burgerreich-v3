name: Collect OSINT Feeds

on:
  schedule:
    # Every 6 hours
    - cron: "0 0,6,12,18 * * *"
    # Friday night sweep
    - cron: "0 22 * * 5"
    # Monday afternoon sweep
    - cron: "30 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Install dependencies
        run: pip install -r collectors/requirements.txt

      - name: Collect CENTCOM
        run: python collectors/collect_centcom.py
        continue-on-error: true

      - name: Collect EUCOM
        run: python collectors/collect_eucom.py
        continue-on-error: true

      - name: Collect INDOPACOM
        run: python collectors/collect_indopacom.py
        continue-on-error: true

      - name: Collect AFRICOM
        run: python collectors/collect_africom.py
        continue-on-error: true

      - name: Collect STRATCOM
        run: python collectors/collect_stratcom.py
        continue-on-error: true

      - name: Collect OSINT feeds
        run: python collectors/collect_osint.py
        continue-on-error: true

      - name: Collect fleet positions
        run: python collectors/collect_fleet.py
        continue-on-error: true

      - name: Collect casualty data
        run: python collectors/collect_casualties.py
        continue-on-error: true

      - name: Collect equipment losses
        run: python collectors/collect_losses.py
        continue-on-error: true

      - name: Collect force posture
        run: python collectors/collect_posture.py
        continue-on-error: true

      - name: Collect COCOM commanders
        run: python collectors/collect_commanders.py
        continue-on-error: true

      - name: Collect Doomsday Clock
        run: python collectors/collect_doomsday.py
        continue-on-error: true

      - name: Merge all feeds
        run: python collectors/merge_feeds.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git diff --cached --quiet || git commit -m "OSINT collect ${TIMESTAMP}"
          git push
